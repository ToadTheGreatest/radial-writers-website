<!DOCTYPE html>
<html>
    <head>
        <title>Radial Writers</title>
        <link rel="icon" type="image/x-icon" href="./favicon.ico">
        <style>
            .site-title {
                font-size: 40px;
                font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            }
            .socials-btn {
                background: none;
                border: none;
                cursor: pointer;
                font-size: 40px;
                font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            }
            .videos-btn {
                background: none;
                border: none;
                cursor: pointer;
                font-size: 40px;
                font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            }
            /* LINK STUFF */
            a {
                text-decoration: none;
                color: #000;
            }
            /* HEADER STUFF */
            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10ps 20px;
            }
            .header-logo {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .header-nav {
                top: 0;
                align-content: right;
            }
            .socials-youtube {
                max-width: 5%;
                max-height: auto;
            }
            .socials {
                font-size: 40px;
                font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            }
        </style>
    </head>
    <body>
        <header>
            <div class="header-logo">
                <a href="../"><img src="./favicon.ico" alt="logo">
                <span class="site-title">RADIAL WRITERS</span></a>
            </div>
            <div class="header-nav">
                <a href="../socials/"><button class="socials-btn">SOCIALS</button></a>
                <a href="./"><button class="videos-btn">VIDEOS</button></a>
            </div>
        </header>
        <div>
            <span class="socials">Our Music Videos</span><br>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/gvgNj31wzLs?si=sL7W8Ig-0jxR9czj" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/hEwYHA3JPrY?si=DFS75nwrb-I_NOFV" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>

</html>
