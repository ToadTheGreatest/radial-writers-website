<!DOCTYPE html>
<html>
    <head>
        <title>Radial Writers</title>
        <link rel="icon" type="image/x-icon" href="./favicon.ico">
        <style>
            .site-title {
                font-size: 40px;
                font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            }
            .socials-btn {
                background: none;
                border: none;
                cursor: pointer;
                font-size: 40px;
                font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            }
            .videos-btn {
                background: none;
                border: none;
                cursor: pointer;
                font-size: 40px;
                font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            }
            /* LINK STUFF */
            a {
                text-decoration: none;
                color: #000;
            }
            /* HEADER STUFF */
            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10ps 20px;
            }
            .header-logo {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .header-nav {
                top: 0;
                align-content: right;
            }
            .socials-youtube {
                max-width: 5%;
                max-height: auto;
            }
            .socials {
                font-size: 40px;
                font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            }
        </style>
    </head>
    <body>
        <header>
            <div class="header-logo">
                <a href="../index.html"><img src="./favicon.ico" alt="logo">
                <span class="site-title">RADIAL WRITERS</span></a>
            </div>
            <div class="header-nav">
                <a href="./index.html"><button class="socials-btn">SOCIALS</button></a>
                <a href="../videos/index.html"><button class="videos-btn">VIDEOS</button></a>
            </div>
        </header>
        <div>
            <span class="socials">Our Socials</span><br>
            <a href="https://youtube.com/@radial_writers"><img class="socials-youtube" src="./youtube.png"></a>
        </div>
    </body>
</html>
